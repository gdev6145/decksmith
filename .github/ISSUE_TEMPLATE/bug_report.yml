name: "🐛 Bug Report"
description: Report a bug, hardware calculation issue, or CAD generator glitch
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Decksmith! Please fill out the form below with as much detail as possible.
  - type: dropdown
    id: component
    attributes:
      label: Affected Studio / Tool
      options:
        - "Blueprint Studio (/builder)"
        - "3D CAD & CNC Studio (/cad)"
        - "OS Flasher Companion (/flasher)"
        - "Field Diagnostics & HUD (/companion)"
        - "Keyboard Matrix Studio (/keyboard)"
        - "Solar & Off-Grid Studio (/solar)"
        - "RF Link Budget Studio (/rf)"
        - "Thermal Dissipation Studio (/cooling)"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: 1. Go to...\n2. Click on...\n3. Scroll down to...\n4. See error.
      placeholder: |
        1. Open Blueprint Studio
        2. Select Raspberry Pi 5 and Waveshare 11.9" LCD
        3. Observe pinout overlap warning
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
  - type: input
    id: environment
    attributes:
      label: OS / Environment
      description: e.g. Ubuntu 24.04, Debian 12, macOS Sonoma, Windows 11 / Node version
