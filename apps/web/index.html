<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Decksmith" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Decksmith - Cyberdeck Architecture & Hardware Studio</title>
    <meta name="description" content="The ultimate cyberdeck builder, 3D CAD parametric studio, real host telemetry, and hardware engineering suite." />
    <meta property="og:title" content="Decksmith - Cyberdeck Studio" />
    <meta property="og:description" content="Design, build, and deploy custom cyberdeck terminals with 3D CAD & real hardware telemetry." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/play-store-feature-graphic.png" />
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        background: #030712;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: #00ff66;
        user-select: none;
      }
      .preloader-img {
        max-width: 280px;
        width: 70vw;
        border-radius: 20px;
        box-shadow: 0 0 40px rgba(0, 255, 102, 0.25);
        animation: pulseGlow 2s infinite ease-in-out;
      }
      .preloader-bar-bg {
        width: 240px;
        height: 6px;
        background: #111827;
        border-radius: 9999px;
        overflow: hidden;
        margin-top: 24px;
        border: 1px solid #1f2937;
      }
      .preloader-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #00e5ff, #00ff66);
        border-radius: 9999px;
        width: 0%;
        animation: loadProgress 1.4s infinite ease-in-out;
      }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); filter: brightness(1); }
        50% { transform: scale(1.02); filter: brightness(1.15) drop-shadow(0 0 15px rgba(0, 255, 102, 0.4)); }
      }
      @keyframes loadProgress {
        0% { width: 10%; transform: translateX(-10%); }
        50% { width: 80%; transform: translateX(10%); }
        100% { width: 100%; transform: translateX(0%); }
      }
    </style>
  </head>
  <body class="bg-gray-950 text-gray-100">
    <div id="root">
      <div id="app-preloader">
        <img src="/splash-loading.png" alt="Decksmith Loading..." class="preloader-img" />
        <div class="preloader-bar-bg">
          <div class="preloader-bar-fill"></div>
        </div>
        <div style="font-size: 11px; margin-top: 12px; color: #9ca3af; letter-spacing: 0.1em;">
          INITIALIZING HARDWARE ENGINE...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
